[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-logic-pipeline"
version = "0.1.0"
description = "Godot Logic Data Collection, Extraction, Cleaning, and Export Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.10.0",
    "networkx>=3.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
godot-logic = "logic_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
